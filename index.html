<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FS25 Manager</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<div class="logo">
<i class="fa-solid fa-tractor"></i>
<h1>FS25 Manager</h1>
</div>

<div class="search">

<input
type="text"
id="search"
placeholder="Rechercher une map...">

</div>

<div class="admin">

<button id="adminButton">

<i class="fa-solid fa-user-shield"></i>

</button>

</div>

</header>

<main>

<div class="cards">

<div class="card">

<img src="images/map1.jpg" alt="Map">

<div class="card-content">

<h2>Nom de la Map</h2>

<p class="money">
💰 20 000 €
</p>

<div class="icons">

<span>🐄</span>

<span>🌾</span>

<span>🏭</span>

</div>

<button>

Ouvrir

</button>

</div>

</div>

<div class="card">

<img src="images/map2.jpg" alt="Map">

<div class="card-content">

<h2>Nom de la Map</h2>

<p class="money">

💰 100 000 €

</p>

<div class="icons">

<span>🌲</span>

<span>🚜</span>

</div>

<button>

Ouvrir

</button>

</div>

</div>

</div>

</main>

<footer>

<p>

© 2026 FS25 Manager

</p>

</footer>

<script src="app.js"></script>

</body>
</html>
